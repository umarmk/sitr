[project]
name = "sitr"
version = "0.1.0"
description = "A privacy boundary between people's messages and AI models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "spacy>=3.8,<3.9",
    # Name-detection model shipped as an ordinary pinned dependency: no download step, no account.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
sitr = "sitr.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitr"]

[tool.hatch.metadata]
# Needed for the direct-URL model wheel above; hatchling rejects it otherwise.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
